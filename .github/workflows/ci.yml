name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs the scripts under the system /bin/bash 3.2 and BSD userland they must support.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Structure
        run: /bin/bash test/structure.test.sh
      - name: Scripts
        run: /bin/bash test/scripts.test.sh
      - name: Mixed-provider coordination
        run: /bin/bash test/coordinator.test.sh
      - name: Claude worker custody
        run: /bin/bash test/custody.test.sh
      - name: Codex worker reports
        run: python3 -B test/codex.test.py
      - name: agy sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q bubblewrap
          # Ubuntu runners refuse unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /bin/bash test/agy-sandbox.test.sh
      - name: agy guard commit
        if: runner.os == 'Linux'
        id: agy-guard
        run: echo "commit=$(tr -d '[:space:]' < test/agy-guard.commit)" >> "$GITHUB_OUTPUT"
      - name: Check out the agy guard's bootstrap commit
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: davekim917/bootstrap
          ref: ${{ steps.agy-guard.outputs.commit }}
          path: .bootstrap
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
        with:
          bun-version: 1.4.2
      - name: agy guard install
        if: runner.os == 'Linux'
        run: |
          # The registration runs the hook with PATH=/usr/local/bin:/usr/bin:/bin, as on the host.
          sudo ln -sf "$(command -v bun)" /usr/local/bin/bun
          AGY_GUARD_CHECKOUT="$PWD/.bootstrap" /bin/bash test/agy-guard-install.test.sh
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck skills/anderton/scripts/*.sh test/*.sh
