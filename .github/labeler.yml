# Which changes need review before they merge. codex-review.sh (`scope`, `merge-check`)
# reads `risk:high` from the base branch and matches each changed file against it; a PR
# touching none of these globs merges on green CI. Keep `risk:high` in the one shape the
# gate reads (one rule, one any-glob-to-any-file list of quoted globs using only * and **)
# or every PR fails closed to review.

risk:high:
- changed-files:
  - any-glob-to-any-file:
    - 'skills/**'
    - 'hooks/**'
    - 'test/**'
    - '.github/**'
    # Every dotfile and dot-directory: the plugin manifest, the public-boundary scan's
    # exemptions, and agent config (.claude, .mcp.json)
    - '.*'
    - '.*/**'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    # What Claude Code loads from a plugin root without a manifest change
    - 'agents/**'
    - 'commands/**'
    - 'output-styles/**'
    - 'bin/**'
    - 'settings.json'
    # Published license terms
    - 'LICENSE*'
    - 'NOTICE.md'
